<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claim Provenance</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; width: 320px; margin: 0; padding: 14px 16px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
  .sub { font-size: 11px; color: #777; margin: 0 0 12px; }
  button { width: 100%; padding: 8px 12px; font-size: 13px; cursor: pointer; border: 1px solid #2a6dfb; background: #2a6dfb; color: #fff; border-radius: 4px; }
  button:disabled { background: #aaa; border-color: #aaa; cursor: progress; }
  button.secondary { background: #fff; color: #2a6dfb; }
  .status { margin-top: 12px; font-size: 12px; line-height: 1.4; color: #555; min-height: 32px; }
  .status.ok { color: #146c2e; }
  .status.error { color: #b00020; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .row button { flex: 1; }
</style>
</head>
<body>
<h1>Claim Provenance</h1>
<p class="sub">Trace claims in this page back to their primary sources.</p>
<button id="analyze">Analyze this page</button>
<div class="row">
  <button id="open-panel" class="secondary">Open side panel</button>
</div>
<div id="status" class="status"></div>
<script src="popup.js"></script>
</body>
</html>
