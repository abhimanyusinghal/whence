<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claim Provenance</title>
<style>
  :root {
    --c-text: #1a1a1a;
    --c-muted: #666;
    --c-border: #e3e3e5;
    --c-card-bg: #fff;
    --c-card-hover: #f7f8fa;
    --c-card-focus: #fff8d6;
    --c-card-focus-border: #f0b400;
    --status-direct_cited: #2e8540;
    --status-primary: #2e8540;
    --status-indirect_cited: #2563eb;
    --status-stale_cited: #d97706;
    --status-circular: #7c3aed;
    --status-untraceable: #dc2626;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0; padding: 14px 14px 24px; color: var(--c-text); font-size: 13px;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 4px;
  }
  .panel-header-actions { display: flex; gap: 6px; align-items: center; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  #settings-btn {
    border: none; background: transparent; color: var(--c-muted);
    font-size: 12px; padding: 4px 6px; cursor: pointer; text-decoration: underline;
  }
  #settings-btn:hover { color: var(--c-text); }
  .sub { font-size: 11px; color: var(--c-muted); margin: 0 0 14px; }
  #analyze-btn {
    padding: 6px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
    border: 1px solid #2a6dfb; background: #2a6dfb; color: #fff;
    border-radius: 4px; white-space: nowrap;
  }
  #analyze-btn:hover:not(:disabled) { background: #1d5be0; border-color: #1d5be0; }
  #analyze-btn:disabled { background: #aaa; border-color: #aaa; cursor: progress; }
  .meta {
    font-size: 11px; color: var(--c-muted); margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--c-border);
  }
  .empty {
    font-size: 12px; color: #888; padding: 40px 8px; text-align: center; line-height: 1.6;
  }
  .empty em { color: #444; font-style: normal; font-weight: 500; }

  .card {
    background: var(--c-card-bg);
    padding: 10px 12px;
    margin-bottom: 8px;
    border: 1px solid var(--c-border);
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.12s, border-color 0.12s;
  }
  .card:hover { background: var(--c-card-hover); }
  .card.focused {
    background: var(--c-card-focus);
    border-color: var(--c-card-focus-border);
  }

  .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 3px;
    text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;
  }
  .badge.s-primary, .badge.s-direct_cited { background: #e2f4e6; color: #0e6627; }
  .badge.s-indirect_cited { background: #e2eaff; color: #1a4ba8; }
  .badge.s-stale_cited { background: #fef0d9; color: #94530a; }
  .badge.s-circular { background: #efe4ff; color: #5a23a3; }
  .badge.s-untraceable { background: #fde0e3; color: #9b1322; }

  .hops { font-size: 11px; color: var(--c-muted); }
  .category { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.3px; margin-left: auto; }

  .claim-text { font-size: 13px; line-height: 1.5; color: var(--c-text); }

  .chain { margin-top: 10px; }
  .node { display: flex; align-items: baseline; gap: 6px; padding: 3px 0; font-size: 11px; line-height: 1.45; }
  .node-arrow { color: #aaa; flex-shrink: 0; font-weight: 600; }
  .node-link { color: #1a4ba8; text-decoration: none; flex: 1 1 auto; min-width: 0; word-break: break-word; }
  .node-link:hover { text-decoration: underline; }
  .node-publisher { color: var(--c-muted); flex-shrink: 0; }
  .node-type {
    font-size: 9px; padding: 1px 4px; border-radius: 2px; background: #f0f0f2; color: #555;
    text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0;
  }
  .node-type.t-primary { background: #e2f4e6; color: #0e6627; }
  .node-type.t-secondary { background: #e8eef9; color: #2c4d8a; }
  .node-type.t-tertiary { background: #f4ebd8; color: #6b4f00; }
  .node-type.t-social { background: #efe4ff; color: #5a23a3; }

  .node-quality {
    font-size: 9px; padding: 1px 4px; border-radius: 2px;
    background: #f0f0f2; color: #555; flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .node-quality.q-hi { background: #e2f4e6; color: #0e6627; }
  .node-quality.q-mid { background: #f4ebd8; color: #6b4f00; }
  .node-quality.q-lo { background: #fde0e3; color: #9b1322; }

  .evidence-quote {
    margin: 4px 0 4px 18px; padding: 6px 10px;
    border-left: 2px solid var(--c-border);
    font-size: 11px; color: #444; line-height: 1.45;
    font-style: italic;
  }

  .notes {
    font-size: 11px; color: #555; margin-top: 8px; line-height: 1.45;
    padding-top: 6px; border-top: 1px dashed var(--c-border);
  }

  .skeleton { padding: 12px; margin-bottom: 8px; border: 1px solid var(--c-border); border-radius: 4px; background: #f6f6f7; }
  .skel-line { height: 8px; background: #e0e0e3; border-radius: 3px; margin-bottom: 6px; }
  .skel-line:last-child { margin-bottom: 0; }
  .skel-line.short { width: 35%; }
  .skel-line.long { width: 92%; }
  .skel-line.med { width: 65%; }
  @keyframes shimmer { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  .skeleton { animation: shimmer 1.4s ease-in-out infinite; }

  .progress {
    margin-bottom: 12px; padding: 10px 12px;
    border: 1px solid #cfdcfb; background: #f3f7ff; border-radius: 4px;
    font-size: 12px; line-height: 1.5;
  }
  .progress-phase { font-weight: 600; color: #1a4ba8; margin-bottom: 4px; display: flex; align-items: baseline; gap: 8px; }
  .progress-elapsed { font-variant-numeric: tabular-nums; color: #666; font-weight: 500; font-size: 11px; }
  .progress-detail { color: #555; font-size: 11px; }
  .progress-bar { margin-top: 8px; height: 4px; background: #dde6f8; border-radius: 2px; overflow: hidden; }
  .progress-bar-fill {
    height: 100%; background: #2a6dfb; width: 0%;
    transition: width 0.4s linear;
  }

  .tab-warning {
    margin-bottom: 10px; padding: 8px 10px;
    background: #fff8d6; border: 1px solid #f0b400; border-radius: 4px;
    font-size: 11px; line-height: 1.45; color: #6b4f00;
  }
  .tab-warning strong { color: #4a3700; }

  .error { color: var(--c-untraceable); font-size: 12px; padding: 16px; border: 1px solid #f3c4ca; background: #fff5f6; border-radius: 4px; }
</style>
</head>
<body>
<header class="panel-header">
  <h1>Claim Provenance</h1>
  <div class="panel-header-actions">
    <button id="settings-btn" type="button" title="Choose search providers and BYOK keys">Settings</button>
    <button id="analyze-btn">Analyze this page</button>
  </div>
</header>
<p class="sub" id="sub">Trace claims on this page back to their primary sources.</p>
<div id="content" class="empty">
  Click <em>Analyze this page</em> above to trace claims on the active tab.
</div>
<script src="sidepanel.js"></script>
</body>
</html>
