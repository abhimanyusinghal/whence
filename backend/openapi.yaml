openapi: 3.1.0
info:
  title: Claim Provenance Engine API
  version: "0.1.0"
  description: |
    Trace claims in articles back to their primary sources. Returns a six-state
    chain classification per claim — not a true/false verdict.

    Six states: `primary`, `direct_cited`, `indirect_cited`, `stale_cited`,
    `circular`, `untraceable`. See `Docs/API.md` for the taxonomy.
  contact:
    url: https://github.com/abhimanyusinghal/claim
  license:
    name: MIT
    url: https://github.com/abhimanyusinghal/claim/blob/main/LICENSE
servers:
  - url: http://localhost:8787
    description: Local (self-hosted) — substitute your own host if you deploy it

# No authentication. Self-host the backend, supply your own provider keys via
# .env (or per-request BYOK in search_options), and call it directly.

paths:
  /healthz:
    get:
      summary: Health check
      description: Returns service status and provider config.
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/analyze:
    post:
      summary: Analyze an article and return per-claim provenance chains
      description: |
        Extracts factual claims from the page text, searches the web for each,
        and assembles a chain of sources from the article back to the most
        upstream primary source it can find. Returns one `ProvenanceChain` per
        extracted `Claim`.

        Typical latency: 25–40 seconds for a 5–10 claim article. Hard cap on
        page text is 60,000 characters (server truncates head + tail if
        exceeded).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
            examples:
              wfh-article:
                summary: A short remote-work piece with two inline citations
                value:
                  url: https://example.com/wfh-2024
                  title: What Four Years of Remote-Work Data Actually Tell Us
                  page_text: |
                    According to the U.S. Bureau of Labor Statistics, 27 percent
                    of U.S. employees worked from home at least one day per
                    week in 2023.
                  page_links:
                    - href: https://www.bls.gov/news.release/atus.t05.htm
                      anchor_text: U.S. Bureau of Labor Statistics
                      near_text: According to the U.S. Bureau of Labor Statistics, 27 percent
      responses:
        "200":
          description: Analysis complete
          headers:
            X-Request-Id:
              schema: { type: string }
              description: Unique identifier for this request. Include when reporting issues.
            X-Cache:
              schema: { type: string, enum: [hit, miss] }
              description: Whether the response was served from the in-memory result cache.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: invalid_request
                message: page_text is required and must be non-empty
                request_id: req_abc123
        "422":
          description: |
            Content rejected by the LLM provider's safety filter (e.g. Azure
            OpenAI content management policy). The article itself is not
            invalid, but the model refused to process it. Switch
            `LLM_PROVIDER` or change articles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: content_blocked
                message: "The AI provider's safety filter blocked this article. This often happens with medical, political, or news content. Try a different article."
                request_id: req_4f67f25c66c6
        "500":
          description: Internal server error or missing config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      required: [ok, service, version, provider]
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
        provider: { type: string, enum: [anthropic, azure_openai] }
        has_anthropic_key: { type: boolean }
        has_azure_key: { type: boolean }
        search_providers_configured:
          type: array
          items: { $ref: "#/components/schemas/ProviderName" }
          description: Providers for which the server has an env key configured.
        cache_size: { type: integer }

    PageLink:
      type: object
      required: [href, anchor_text, near_text]
      properties:
        href:
          type: string
          format: uri
          description: Absolute URL of the link.
        anchor_text:
          type: string
          description: The visible text of the `<a>` tag, trimmed.
        near_text:
          type: string
          description: |
            Sentence containing the link, or ~600 characters around it. Used by
            the classifier to associate links with claims.

    ProviderName:
      type: string
      enum: [tavily, brave, serper, google_pse, bing]

    SearchOptions:
      type: object
      description: |
        Per-request override for which web-search providers to use, with
        optional BYOK keys. When omitted, the server uses every provider it
        has an env key for. When `providers` is supplied, only that subset
        runs; any provider in the list with neither an env key nor a BYOK
        key is reported as skipped in `meta.search_providers_skipped`.

        All enabled providers run in parallel within each claim, so total
        latency is dominated by the slowest provider, not the sum. Adding
        providers does cost rate-limit budget (one query per provider per
        claim) and increases the chance of partial failures the aggregator
        has to absorb.
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ProviderName" }
          description: Subset of providers to use for this request.
        byok:
          type: object
          description: User-supplied API keys, override env keys for the listed provider(s).
          properties:
            tavily: { type: string }
            brave: { type: string }
            serper: { type: string }
            bing: { type: string }
            google_pse:
              type: object
              required: [key, cx]
              properties:
                key: { type: string, description: Google Cloud API key. }
                cx: { type: string, description: Programmable Search Engine id. }

    PageProvenance:
      type: object
      description: |
        Provenance metadata captured at extraction time. All fields optional —
        older clients may omit the entire object. When present, it is logged
        with every chain so a later audit can prove what the user actually saw,
        even if the source page changes.
      properties:
        canonical_url:
          type: string
          format: uri
          description: "`<link rel=\"canonical\">` if the page declared one."
        author:
          type: string
          description: Best-effort author from `meta` tags or JSON-LD.
        published_date:
          type: string
          description: Publication date when discoverable (ISO 8601 preferred).
        accessed_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp at the moment the extension extracted the page.
        html_hash:
          type: string
          description: |
            Hex-encoded SHA-256 of `documentElement.outerHTML` at extraction
            time. Lets a future re-fetch detect whether the page changed.

    AnalyzeRequest:
      type: object
      required: [url, title, page_text, page_links]
      properties:
        url:
          type: string
          format: uri
          description: Canonical URL of the article being analyzed. Becomes node[0] of every chain.
        title:
          type: string
          description: Article title (e.g. `<title>` text).
        page_text:
          type: string
          description: |
            Plain-text body of the article. Capped at 60,000 characters
            server-side; longer payloads are truncated head + tail.
        page_links:
          type: array
          items: { $ref: "#/components/schemas/PageLink" }
          description: All hyperlinks on the page with their anchor + surrounding text.
        provenance:
          $ref: "#/components/schemas/PageProvenance"
        search_options:
          $ref: "#/components/schemas/SearchOptions"

    Claim:
      type: object
      required: [id, text, normalized, category, importance]
      properties:
        id:
          type: string
          description: Stable identifier (sha256 prefix of `text`).
        text:
          type: string
          description: Verbatim claim from the article.
        normalized:
          type: string
          description: Search-friendly rewrite of the claim with key entities preserved.
        category:
          type: string
          enum: [statistic, quote, study_reference, event, attribution]
        importance:
          type: integer
          enum: [1, 2, 3]
          description: 1 = central to thesis, 2 = supporting, 3 = peripheral.
        inline_link:
          type: [string, "null"]
          format: uri
          description: URL the article hyperlinks near this claim, if any.

    ProvenanceStatus:
      type: string
      enum:
        - primary
        - direct_cited
        - indirect_cited
        - stale_cited
        - circular
        - untraceable

    SourceType:
      type: string
      enum: [primary, secondary, tertiary, social, unknown]

    ProvenanceNode:
      type: object
      required:
        - url
        - title
        - publisher
        - type
        - links_to_upstream
        - snippet
        - evidence_quote
        - source_quality_score
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        publisher: { type: string }
        published_date:
          type: [string, "null"]
          description: ISO 8601 date when known.
        type: { $ref: "#/components/schemas/SourceType" }
        links_to_upstream:
          type: array
          items: { type: string, format: uri }
          description: URLs (within the candidate set) that this node cites for THIS claim.
        snippet:
          type: string
          description: Raw Tavily content blob — may be a 1–2 sentence teaser. Use `evidence_quote` for the verbatim span the chain decision relies on.
        evidence_quote:
          type: string
          description: |
            Verbatim span copied from this node's snippet that anchors the chain
            decision. Empty string when the node carries no support for the claim
            (e.g. the article-itself node, or a stale/distorted candidate).
        source_quality_score:
          type: number
          minimum: 0
          maximum: 1
          description: |
            0..1 quality signal. Tie-breaker between candidates and
            sortable downstream. Rubric is in the system prompt; baselines run
            from `1.0` (gov agencies / peer-reviewed / regulatory) down to
            `0.2` (social/forum). Penalties apply for missing date, missing
            author, or snippet that doesn't actually support the claim.

    ProvenanceChain:
      type: object
      required: [claim_id, status, hop_count, nodes, notes]
      properties:
        claim_id:
          type: string
          description: Matches a `Claim.id` from the same response.
        status: { $ref: "#/components/schemas/ProvenanceStatus" }
        hop_count:
          type: integer
          description: |
            0 = article is itself the primary; 1 = direct cite; ≥2 = indirect.
            -1 = circular or untraceable.
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ProvenanceNode" }
          description: Ordered chain — article → ... → primary.
        notes:
          type: string
          description: 1–2 sentence reasoning from the classifier.

    AnalyzeMeta:
      type: object
      required: [tokens_used, search_queries, ms]
      properties:
        tokens_used: { type: integer }
        search_queries:
          type: integer
          description: |
            Total search calls fanned out across providers. With multiple
            providers enabled this is roughly `claims × providers + retries`.
        ms: { type: integer, description: Wall-clock time for the full pipeline. }
        search_providers_used:
          type: array
          items: { $ref: "#/components/schemas/ProviderName" }
          description: Distinct providers that returned at least one result.
        search_provider_errors:
          type: object
          additionalProperties: { type: string }
          description: Provider name → most recent error message seen across this analysis.
        search_providers_skipped:
          type: array
          items: { $ref: "#/components/schemas/ProviderName" }
          description: Providers that were requested but had no env or BYOK key available.

    AnalyzeResponse:
      type: object
      required: [claims, chains, meta, request_id, fallback_uses]
      properties:
        request_id:
          type: string
          description: Same value as the `X-Request-Id` response header.
        claims:
          type: array
          items: { $ref: "#/components/schemas/Claim" }
        chains:
          type: array
          items: { $ref: "#/components/schemas/ProvenanceChain" }
          description: One chain per claim, ordered by claim index. Use `claim_id` to match.
        meta: { $ref: "#/components/schemas/AnalyzeMeta" }
        fallback_uses:
          type: integer
          description: |
            Number of claims where the false-untraceable retry fired
            (Tavily re-search with `include_raw_content: true`). Each fallback
            adds one Tavily search and one classify call.

    ErrorEnvelope:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - missing_config
            - content_blocked
            - internal_error
        message: { type: string }
        request_id: { type: string }
